<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makan Mana? – Pagoh student food guide</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf6e9;--card:#f6ead6;--text:#3b2a20;--muted:#7d6858;--brand:#c4572b;--brand2:#c4572b;--accent:#f8dc7e;--line:#ead9bd;--blue:#f8dc7e;--onbrand:#ffffff;--foot:#3b2a20;--sh:0 4px 14px rgba(59,42,32,.08);--sh2:0 12px 26px rgba(59,42,32,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a14;--card:#33261d;--text:#fdf1d6;--muted:#cdb89c;--brand:#e8794a;--brand2:#f8dc7e;--accent:#f8dc7e;--line:#4a392c;--onbrand:#241a14;--foot:#1a120d;--sh:0 4px 14px rgba(0,0,0,.3);--sh2:0 12px 26px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241a14;--card:#33261d;--text:#fdf1d6;--muted:#cdb89c;--brand:#e8794a;--brand2:#f8dc7e;--accent:#f8dc7e;--line:#4a392c;--onbrand:#241a14;--foot:#1a120d;--sh:0 4px 14px rgba(0,0,0,.3);--sh2:0 12px 26px rgba(0,0,0,.45);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;font-weight:800;line-height:1.2}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:1.3rem;color:var(--brand)}
.brand img{height:42px;width:auto}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{text-decoration:none;padding:6px 11px;border-radius:99px;font-size:.88rem;font-weight:600}
nav a.on{background:var(--blue);color:#3b2a20}
main{max-width:1000px;margin:0 auto;padding:20px 16px 36px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;background:#3b2a20;color:#fff3d6;border-radius:24px;overflow:hidden}
.hero .txt{padding:34px 30px}
.hero h1{margin:0 0 10px;font-size:clamp(1.6rem,4.5vw,2.4rem)}
.hero p{margin:0 0 18px;opacity:.9}
.hero .eyebrow{color:#f8dc7e}
.hero{background-size:cover;background-position:center}
.hero .art{display:grid;place-items:center;padding:16px}
.hero .art img{width:min(100%,220px);background:#fff3d6;border-radius:50%;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.sb{display:flex;gap:8px;flex-wrap:wrap}
.sb input{flex:1;min-width:160px}
input,select,button{font:inherit}
input[type=search],select{padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);min-width:0}
.btn{background:var(--brand);color:var(--onbrand);border:none;padding:11px 20px;border-radius:99px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:#3b2a20;color:#fff3d6}
.btn.gold{background:#fff3d6;color:#3b2a20}
.btn.ghost{background:var(--blue);color:#3b2a20;padding:7px 14px;font-size:.88rem}
h2.sec{font-size:1.3rem;margin:26px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 15px;border-radius:99px;cursor:pointer;font-weight:600;text-decoration:none;font-size:.9rem}
.chip.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.cta{margin-top:26px;background:var(--blue);color:#3b2a20;border-radius:20px;padding:24px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cta h3{margin:0 0 2px;font-size:1.3rem}.cta p{margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin:14px 0}
.fbar label{font-size:.78rem;font-weight:700;display:flex;flex-direction:column;gap:4px}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.count{font-size:.85rem;color:var(--muted);margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:120px;display:grid;place-items:center;font-size:3.4rem;background:var(--blue)}
.card .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.card h3{margin:0;font-size:1.1rem}
.sm{font-size:.82rem;color:var(--muted)}
.price{font-weight:800;font-size:.9rem}
.card .btn{margin-top:auto;font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--blue);color:#3b2a20}
.tag.open{background:var(--brand);color:var(--onbrand)}.tag.closed{background:#868e96;color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0}
.panel h3{margin:0 0 8px}
.rows div{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.pic{overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.big{overflow:hidden}.big img{height:100%;max-width:100%;object-fit:contain}
.big{height:200px;border-radius:20px;background:var(--blue);display:grid;place-items:center;font-size:5rem;margin:12px 0}
.tip{background:var(--card);border-left:5px solid var(--blue);border-radius:12px;padding:12px 16px}
.empty{text-align:center;color:var(--muted);padding:30px;grid-column:1/-1}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.wrap{position:relative;width:min(320px,86vw)}
.wrap canvas{width:100%;height:auto;display:block;transition:transform 4s cubic-bezier(.12,.7,.1,1)}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:2rem;color:var(--brand2);z-index:2}
.result{font-size:1.3rem;font-weight:800;text-align:center;min-height:2em}
footer{background:var(--foot);color:#fff3d6;padding:22px 16px;font-size:.85rem}
footer .in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer p{margin:2px 0;max-width:340px}
html{scroll-behavior:smooth}
.card,.panel,.cta,.tip{box-shadow:var(--sh)}
.card{transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.card .pic{transition:transform .35s ease}.card:hover .pic{transform:scale(1.06)}
.card{overflow:hidden}
.btn,.chip,nav a{transition:transform .2s ease,filter .2s ease,background .2s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 6px 14px rgba(59,42,32,.25)}
.chip:hover{transform:translateY(-2px);background:var(--blue);color:#3b2a20}
nav a:hover{background:var(--card)}
.hero{box-shadow:var(--sh2)}
input:focus,select:focus{outline:3px solid var(--blue);border-color:var(--brand)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media(max-width:640px){.hero{grid-template-columns:1fr}.hero .art{order:-1;padding:10px}.hero .art img{width:120px;padding:8px}.hero .txt{padding:22px 18px}}
</style></head>

function filtered(){
  return RESTAURANTS.filter(r=>{
    const q=state.q.toLowerCase();
    if(q&&!(r.name+r.type+r.area+r.menu.map(m=>m[0]).join(" ")).toLowerCase().includes(q))return false;
    if(state.cat==="open"&&!isOpen(r))return false;
    if(TAGN[state.cat]&&!r.tags.includes(state.cat))return false;
    if(state.type!=="all"&&r.type!==state.type)return false;
    if(state.area!=="all"&&r.area!==state.area)return false;
    if(state.price!=="all"&&r.priceMin>+state.price)return false;
    if(state.pick&&!(r.tags.includes("affordable")||r.tags.includes("near")))return false;
    return true;
  });
}
function cardHTML(r){
  const i=RESTAURANTS.indexOf(r);
  return `<div class="card"><div class="pic">${PHOTOS[r.name]?`<img src="${PHOTOS[r.name]}" alt="">`:r.emoji}</div><div class="in">
  <div class="sm">${esc(r.type)} · ${esc(r.area)}</div><h3>${esc(r.name)}</h3>
  <div class="price">${money(r.priceMin)}–${money(r.priceMax)}</div>
  <div class="sm">Hours: ${fmtH(r.open)}–${fmtH(r.close)}${closedTxt(r)}</div>
  <div style="margin:4px 0 8px"><span class="tag ${isOpen(r)?"open":"closed"}">${isOpen(r)?"Open now":"Closed"}</span> ${r.tags.map(t=>`<span class="tag">${TAGN[t]}</span>`).join(" ")}</div>
  <a class="btn" href="#restaurant-${i}">View Details →</a></div></div>`;
}

function home(){
  app.innerHTML=`<div class="hero" style="background-image:linear-gradient(90deg,rgba(59,42,32,.93) 0%,rgba(59,42,32,.82) 55%,rgba(59,42,32,.5) 100%),url(${HERO})"><div class="txt"><p class="eyebrow">The Pagoh student food guide</p>
  <h1>Confused where to eat? Makan Mana?</h1><p>Good food, student budgets, fewer “where should we go?” debates. Find your next bite around Pagoh and Muar.</p>
  <div class="sb"><input type="search" id="hq" placeholder="Search nasi lemak, roti canai…" aria-label="Search"><button class="btn gold" id="go">Find food →</button></div></div>
  <div class="art"><img src="${LOGO}" alt=""></div></div>
  <h2 class="sec">What are you craving?</h2>
  <div class="chips">${[["affordable","🍛 Affordable Meals"],["all","🍜 Food Types"],["hidden","💎 Hidden Gems"],["near","📍 Near Campus"],["open","🕒 Open Now"]].map(c=>`<button class="chip" data-cat="${c[0]}">${c[1]}</button>`).join("")}</div>
  <div class="cta"><div><h3>Can’t decide? Leave it to luck.</h3><p>One spin. One delicious plan.</p></div><a class="btn alt" href="#wheel">🎡 Spin the Wheel</a></div>`;
  const go=()=>{state.q=$("#hq").value;state.cat="all";location.hash="restaurants"};
  $("#go").onclick=go;$("#hq").onkeydown=e=>{if(e.key==="Enter")go()};
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.q="";state.cat=b.dataset.cat;location.hash="restaurants"});
}

function restaurants(){
  const opt=(arr,v)=>arr.map(t=>`<option ${v===t?"selected":""}>${esc(t)}</option>`).join("");
  const types=[...new Set(RESTAURANTS.map(r=>r.type))],areas=[...new Set(RESTAURANTS.map(r=>r.area))];
  app.innerHTML=`<p class="eyebrow">The food lineup</p><h1 style="margin:0 0 4px">Find your next makan spot.</h1>
  <div class="sm">Check current hours, prices and location before heading out.</div>
  <div class="panel fbar">
   <label>Search<input type="search" id="q" placeholder="Name or dish" value="${esc(state.q)}"></label>
   <label>Price<select id="price"><option value="all">Any price</option>${[5,10,15].map(p=>`<option value="${p}" ${state.price==p?"selected":""}>From under RM${p+1}</option>`).join("")}</select></label>
   <label>Food type<select id="type"><option value="all">All types</option>${opt(types,state.type)}</select></label>
   <label>Location<select id="area"><option value="all">All locations</option>${opt(areas,state.area)}</select></label>
   <label class="chk"><input type="checkbox" id="pick" ${state.pick?"checked":""}> Student picks</label></div>
  <div class="count" id="count"></div><div class="grid" id="grid"></div>`;
  const draw=()=>{const l=filtered();
    $("#count").innerHTML=l.length+" spot"+(l.length===1?"":"s")+" found"+(CATN[state.cat]?` · <b>${CATN[state.cat]}</b> <button class="chip" id="clr" style="padding:2px 10px">clear ✕</button>`:"");
    $("#grid").innerHTML=l.length?l.map(cardHTML).join(""):'<div class="empty">No eateries match. Try another filter 🍽️</div>';
    const c=$("#clr");if(c)c.onclick=()=>{state.cat="all";draw()}};
  draw();
  $("#q").oninput=e=>{state.q=e.target.value;draw()};
  $("#price").onchange=e=>{state.price=e.target.value;draw()};
  $("#type").onchange=e=>{state.type=e.target.value;draw()};
  $("#area").onchange=e=>{state.area=e.target.value;draw()};
  $("#pick").onchange=e=>{state.pick=e.target.checked;draw()};
}

function detail(i){
  const r=RESTAURANTS[i];if(!r){location.hash="restaurants";return}
  const map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.name.replace(" (sample)","")+" "+r.address);
  app.innerHTML=`<a class="chip" href="#restaurants">← Back to restaurants</a>
  <h1 style="margin:16px 0 2px">${esc(r.name)}</h1><div class="sm">${esc(r.type)} · ${esc(r.area)} · ${money(r.priceMin)}–${money(r.priceMax)}</div>
  <div class="big"${PHOTOS[r.name]?' style="background:#1b1b1b"':""}>${PHOTOS[r.name]?`<img src="${PHOTOS[r.name]}" alt="${esc(r.name)}">`:r.emoji}</div>
  <div class="two"><div class="panel"><h3>🍽️ What to order</h3><div class="rows">${r.menu.map(m=>`<div><span>${esc(m[0])}</span><b>${m[1]==null?"":money(m[1])}</b></div>`).join("")}</div></div>
  <div class="panel"><h3>🗺️ Plan your visit</h3><div class="rows">
   <div><span>Hours</span><b>${fmtH(r.open)}–${fmtH(r.close)}${closedTxt(r)} <span class="tag ${isOpen(r)?"open":"closed"}">${isOpen(r)?"Open now":"Closed"}</span></b></div>
   <div><span>Phone</span><b>${r.phone?`<a href="tel:${esc(r.phone.replace(/\s/g,""))}">${esc(r.phone)}</a>`:"Not yet added"}</b></div>
   <div><span>Area</span><b>${esc(r.area)}</b></div>
   <div><span>Address</span><b style="text-align:right">${esc(r.address)}</b></div></div>
   <p><a class="btn" target="_blank" rel="noopener" href="${map}">Open in Google Maps ↗</a></p></div></div>
  <div class="tip"><b class="brand">💡 Student tip</b><br>${esc(r.tip||"Check the current menu and location before travelling.")}</div>
  ${r.name.includes("(sample)")?'<p class="sm">This is a sample entry, not a verified business. Confirm prices, hours and location before visiting.</p>':""}`;
}

/* ---------- Spin the wheel ---------- */
let spins=0,pool=[],wf={price:"all",tag:"all"};
const COLORS=["#3b2a20","#f8dc7e","#c4572b","#fff3d6","#e08a5b","#7a4a35"];
function wheel(){
  app.innerHTML=`<div class="panel wheelbox"><h2 style="margin:0">🎡 Spin the Wheel</h2><div class="sm" style="text-align:center">Pick filters, tick the places you like, then spin.</div>
  <div class="chips"><select id="wp"><option value="all">Any price</option><option value="6">From under RM7</option><option value="10">From under RM11</option></select>
  <select id="wt"><option value="all">All places</option><option value="near">Near campus</option><option value="affordable">Affordable</option><option value="hidden">Hidden gems</option></select></div>
  <div id="picks" class="chips" style="justify-content:center"></div>
  <div class="wrap"><div class="pointer">▼</div><canvas id="cv" width="640" height="640"></canvas></div>
  <button class="btn" id="spin">Spin!</button><div class="result" id="res"></div></div>`;
  const sel=new Set(RESTAURANTS.map((_,i)=>i));
  const compute=()=>{pool=RESTAURANTS.map((r,i)=>({r,i})).filter(({r,i})=>sel.has(i)&&(wf.price==="all"||r.priceMin<=+wf.price)&&(wf.tag==="all"||r.tags.includes(wf.tag)))};
  const picks=()=>{$("#picks").innerHTML=RESTAURANTS.map((r,i)=>`<button class="chip ${sel.has(i)?"on":""}" data-p="${i}">${r.emoji} ${esc(r.name.replace(" (sample)",""))}</button>`).join("");
    document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const i=+b.dataset.p;sel.has(i)?sel.delete(i):sel.add(i);refresh()})};
  const refresh=()=>{compute();picks();drawWheel()};
  $("#wp").onchange=e=>{wf.price=e.target.value;refresh()};
  $("#wt").onchange=e=>{wf.tag=e.target.value;refresh()};
  $("#spin").onclick=()=>{
    if(pool.length<2){$("#res").textContent="Choose at least 2 places 🙂";return}
    const n=pool.length,a=360/n,w=Math.floor(Math.random()*n);spins++;
    const jitter=(Math.random()-.5)*a*.7,R=spins*1800+360-(w*a+a/2)+jitter;
    $("#cv").style.transform=`rotate(${R}deg)`;$("#spin").disabled=true;$("#res").textContent="…";
    setTimeout(()=>{$("#spin").disabled=false;const r=pool[w].r;$("#res").innerHTML=`${r.emoji} ${esc(r.name)}<br><a class="btn" href="#restaurant-${pool[w].i}" style="margin-top:8px;font-size:.9rem">View details →</a>`},4100);
  };
  refresh();
}
function drawWheel(){
  const cv=$("#cv");if(!cv)return;cv.style.transition="none";cv.style.transform="rotate(0deg)";void cv.offsetWidth;cv.style.transition="";spins=0;
  const c=cv.getContext("2d"),S=640,n=pool.length;c.clearRect(0,0,S,S);
  if(n<1){c.fillStyle="#999";c.font="28px system-ui";c.textAlign="center";c.fillText("No places selected",S/2,S/2);return}
  const a=2*Math.PI/n;
  pool.forEach((p,i)=>{c.beginPath();c.moveTo(S/2,S/2);c.arc(S/2,S/2,S/2-6,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);c.closePath();
    c.fillStyle=COLORS[i%COLORS.length];c.fill();c.strokeStyle="#fff";c.lineWidth=4;c.stroke();
    c.save();c.translate(S/2,S/2);c.rotate(-Math.PI/2+i*a+a/2);c.fillStyle=[1,3].includes(i%COLORS.length)?"#3b2a20":"#fff";c.font="bold 26px system-ui";c.textAlign="right";
    c.fillText(p.r.emoji+" "+p.r.name.replace(" (sample)","").slice(0,16),S/2-30,9);c.restore()});
}

/* ---------- Forms, about ---------- */
function formPage(title,intro,url,fields){
  app.innerHTML=`<div class="panel"><h2 style="margin-top:0">${title}</h2><p>${intro}</p>
  <p class="sm">Details to include: ${fields}</p>
  ${url?`<a class="btn" target="_blank" rel="noopener" href="${esc(url)}">Open the form</a>`:`<p class="tip">The team has not linked the Google Form yet. For now, email <b>${esc(CONFIG.teamContact)}</b> with the details above.</p>`}
  <p class="sm" style="margin-top:12px">All submissions are reviewed by the project team before being published.</p></div>`;
}
const pages={home,restaurants,wheel,
  recommend:()=>formPage("Recommend an eatery or send an update","Know a great spot or spotted a wrong price? Tell us so other students can benefit.",CONFIG.recommendFormUrl,"name, location, food type, price, photo, comments"),
  owners:()=>formPage("For restaurant owners","Join Makan Mana? for free and let students find your latest menu, prices and opening hours.",CONFIG.ownerFormUrl,"restaurant name, address, phone, menu with prices, opening hours"),
  about:()=>{app.innerHTML=`<div class="panel"><h2 style="margin-top:0">About Makan Mana?</h2>
  <p>New to Pagoh? Food information is scattered across maps, social media and chat groups, which makes it hard to compare and decide. Makan Mana? brings menus, prices, opening hours and map links together in one simple page, with no sign-up needed.</p>
  <p>Students share recommendations and updates, restaurant owners keep their details current, and the project team reviews every submission.</p>
  <p class="sm">Project team: add your names here (edit the About section in the file).</p></div>`}};
function route(){
  const v=(location.hash||"#home").slice(1);
  const m=v.match(/^restaurant-(\d+)$/);
  const k=m?"restaurants":(pages[v]?v:"home");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===k));
  m?detail(+m[1]):pages[k]();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script></body></html>
